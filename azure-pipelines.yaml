# Node.js
# Build a Next.js project with pnpm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

#trigger:
# - main

pool:
  vmImage: ubuntu-latest

variables:
  pnpm_config_cache: $(Pipeline.Workspace)/.pnpm-store

steps:
  - checkout: self
    submodules: true

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Install Node.js 22'

  - script: |
      corepack enable
      corepack prepare pnpm@latest --activate
    displayName: 'Install pnpm'

  # - task: Cache@2
  #   inputs:
  #     key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
  #     restoreKeys: |
  #       pnpm | "$(Agent.OS)"
  #     path: $(pnpm_config_cache)
  #   displayName: 'Cache pnpm store'

  - task: Cache@2
    inputs:
      key: 'nextjs | "$(Agent.OS)" | pnpm-lock.yaml | **/*.ts, **/*.tsx, **/*.js, **/*.jsx, **/*.md'
      restoreKeys: |
        nextjs | "$(Agent.OS)" | pnpm-lock.yaml
        nextjs | "$(Agent.OS)"
      path: .next/cache
    displayName: 'Cache Next.js build'

  - script: |
      pnpm install --frozen-lockfile
    displayName: 'Install dependencies'

  - script: |
      pnpm run lint
    displayName: 'Lint code'

  - script: |
      pnpm run type-check
    displayName: 'Type check'

  - script: |
      pnpm run build
    displayName: 'Build Next.js application'

  # Uncomment to deploy to Azure Static Web Apps
  # - task: AzureStaticWebApp@0
